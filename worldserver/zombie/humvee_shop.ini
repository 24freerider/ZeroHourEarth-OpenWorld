; Zombie run of World Exploration: the Humvee is a shop (Zero Hour Earth v0.54.1 Survival, see LICENSE.txt).
; Page 1 trains infantry inside the Humvee (TransportContain is the exit of ProductionUpdate), page 2 sells
; upgrades (the GLA worker's page-switch upgrades). Only the Humvee's part of the reference is used.

Object AmericaVehicleHumvee
  CommandSet = EARTH_HumveeSurvivalSet
  UpgradeCameo1 = Upgrade_AmericaCompositeArmor
  UpgradeCameo2 = Upgrade_GLAJunkRepair
  UpgradeCameo3 = Upgrade_AmericaTOWMissile
  UpgradeCameo4 = Upgrade_AmericaAdvancedTraining
  UpgradeCameo5 = Upgrade_AmericaRangerFlashBangGrenade
  RemoveModule ModuleTag_05
  RemoveModule ModuleTag_08
  RemoveModule ModuleTag_16
  RemoveModule ModuleTag_CratesChange
  AddModule
   Behavior = TransportContain ModuleTag_EARTH_Shop
    PassengersAllowedToFire = Yes
    Slots = 6
    DamagePercentToUnits = 100%
    AllowInsideKindOf = INFANTRY
    ExitDelay = 250
    NumberOfExitPaths = 3
    GoAggressiveOnExit = Yes
   End
   Behavior = ProductionUpdate ModuleTag_EARTH_ShopQueue
    MaxQueueEntries = 9
   End
   Behavior = CommandSetUpgrade ModuleTag_EARTH_Page2
    TriggeredBy = Upgrade_GLAWorkerFakeCommandSet
    RemovesUpgrades = Upgrade_GLAWorkerRealCommandSet
    CommandSet = EARTH_HumveeUpgradeCommandSet
   End
   Behavior = CommandSetUpgrade ModuleTag_EARTH_Page1
    TriggeredBy = Upgrade_GLAWorkerRealCommandSet
    RemovesUpgrades = Upgrade_GLAWorkerFakeCommandSet Upgrade_GLAWorkerRealCommandSet
    CommandSet = EARTH_HumveeSurvivalSet
   End
   Behavior = MaxHealthUpgrade ModuleTag_EARTH_Armor
    TriggeredBy = Upgrade_AmericaCompositeArmor
    AddMaxHealth = 800.0
    ChangeType = ADD_CURRENT_HEALTH_TOO
   End
   Behavior = AutoHealBehavior ModuleTag_EARTH_Repair
    HealingAmount = 10
    HealingDelay = 1000
    TriggeredBy = Upgrade_GLAJunkRepair
   End
   ; World Exploration: the nuke, ready from the start and again at once (no reload); the missile flies from the Humvee
   Behavior = OCLSpecialPower ModuleTag_EARTH_Nuke
    SpecialPowerTemplate = SuperweaponNeutronMissile
    OCL = SUPERWEAPON_NeutronMissile
    StartsReady = Yes
   End
  End
End

; World Exploration: the nuke button (the game's, without the science it asks for)
CommandButton EARTH_Command_Nuke
  Command = SPECIAL_POWER
  SpecialPower = SuperweaponNeutronMissile
  Options = NEED_TARGET_POS CONTEXTMODE_COMMAND
  TextLabel = CONTROLBAR:NeutronMissile
  ButtonImage = SNNukeLaunch
  ButtonBorderType = ACTION
  InvalidCursorName = GenericInvalid
  RadiusCursorType = NUCLEARMISSILE
  DescriptLabel = CONTROLBAR:TooltipFireNukeMissile
End

; World Exploration: three times the game's nuke - three times the reach (210 -> 630) and the damage
; (3500/300 -> 10500/900), and no timer: it is ready again as soon as it is fired
SpecialPower SuperweaponNeutronMissile
  Enum = SPECIAL_NEUTRON_MISSILE
  ReloadTime = 0
  InitiateAtLocationSound = AirRaidSiren
  PublicTimer = No
  ViewObjectDuration = 40000
  ViewObjectRange = 700.0
  RadiusCursorRadius = 630.0
  ShortcutPower = Yes
  AcademyClassify = ACT_SUPERPOWER
End

