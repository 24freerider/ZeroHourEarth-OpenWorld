Object CINE_GLAInfantryTerrorist
  BuildCost = 1500
  Scale = 1.2
  VisionRange = 5000
  ShroudClearingRange = 5000
  KindOf = PRELOAD SELECTABLE CAN_ATTACK CAN_CAST_REFLECTIONS INFANTRY SALVAGER SCORE
  Prerequisites
  End
  Locomotor = SET_NORMAL EARTH_ZLoco32_20 ColonelBurtonCliffLocomotor
  Locomotor = SET_NORMAL_UPGRADED EARTH_ZLoco36_25 ColonelBurtonCliffLocomotor
  RemoveModule ModuleTag_Death04
  RemoveModule ModuleTag_01
  RemoveModule ModuleTag_02
  AddModule
   Body = ActiveBody ModuleTag_EARTH_ZBody
    MaxHealth = 300.0
    InitialHealth = 300.0
   End
   Draw = W3DModelDraw ModuleTag_EARTH_Burn
    DefaultConditionState
      Model = CIBURN_SKN
      Animation = CIBURN_SKL.CIBURN_RNA
      AnimationMode = LOOP
      Flags = RANDOMSTART
      ParticleSysBone = Bone_FX1 FireInfantrySmall
    End
    ConditionState = DYING
      Animation = CIBURN_SKL.CIBURN_FLA
      AnimationMode = ONCE
      Flags = START_FRAME_FIRST
      ParticleSysBone = Bone_FX1 FireInfantrySmallSub1
      ParticleSysBone = Bone_FX2 FireInfantrySmallSub2
      ParticleSysBone = Bone_FX9 FireInfantrySmallSub3
      ParticleSysBone = Bone_FX3 FireInfantrySmallSub4
      ParticleSysBone = Bone_FX5 FireInfantrySmallSub5
      ParticleSysBone = Bone_FX6 FireInfantrySmallSub6
      ParticleSysBone = Bone_FX5 FireInfantrySmallSub7
      ParticleSysBone = Bone_FX8 FireInfantrySmallSub8
      ParticleSysBone = Bone_FX7 FireInfantrySmallSub9
      ParticleSysBone = Bone_FX8 FireInfantrySmallSub10
      AnimationSpeedFactorRange = 0.85 1.15
    End
   End
   Behavior = FireWeaponWhenDeadBehavior ModuleTag_EARTH_Shock
    DeathWeapon = EARTH_ZombieShockwave
    StartsActive = Yes
    DeathTypes = ALL
   End
   Behavior = FireWeaponWhenDeadBehavior ModuleTag_EARTH_Boom
    DeathWeapon = SuicideDynamitePack
    StartsActive = Yes
    DeathTypes = NONE +SUICIDED
   End
   Behavior = MaxHealthUpgrade ModuleTag_EARTH_Armour
    TriggeredBy = Upgrade_AmericaCompositeArmor
    AddMaxHealth = 30.0
    ChangeType = ADD_CURRENT_HEALTH_TOO
   End
   Behavior = LocomotorSetUpgrade ModuleTag_EARTH_Engine
    TriggeredBy = Upgrade_ChinaNuclearTanks
   End
   Behavior = LifetimeUpdate ModuleTag_EARTH_Life
    MinLifetime = 240000
    MaxLifetime = 300000
   End
  End
End

