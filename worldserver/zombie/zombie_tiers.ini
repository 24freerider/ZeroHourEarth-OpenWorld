  Prerequisites
  End
  Locomotor = SET_NORMAL EARTH_ZLoco25_20 ColonelBurtonCliffLocomotor
  Locomotor = SET_NORMAL_UPGRADED EARTH_ZLoco32_20 ColonelBurtonCliffLocomotor
